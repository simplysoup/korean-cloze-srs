name: Mobile (Expo)

on:
  push:
    paths:
      - 'mobile/**'
      - 'scripts/validate-content.mjs'
      - 'scripts/validate-grammar-catalogue.ts'
      - 'scripts/port-language-topics.mjs'
      - 'scripts/validate-language-topics.mjs'
      - 'scripts/curriculum-overlay.mjs'
      - 'scripts/port-vocabulary.mjs'
      - 'scripts/validate-vocabulary.mjs'
      - 'docs/research/grammar-answer-ambiguity-audit.json'
      - 'scripts/validate-answer-audit.mjs'
      - 'prisma/seed-data/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'scripts/validate-content.mjs'
      - 'scripts/validate-grammar-catalogue.ts'
      - 'scripts/port-language-topics.mjs'
      - 'scripts/validate-language-topics.mjs'
      - 'scripts/curriculum-overlay.mjs'
      - 'scripts/port-vocabulary.mjs'
      - 'scripts/validate-vocabulary.mjs'
      - 'docs/research/grammar-answer-ambiguity-audit.json'
      - 'scripts/validate-answer-audit.mjs'
      - 'prisma/seed-data/**'
      - '.github/workflows/mobile.yml'

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Verify all app content is reproducible from the authoring sources
        run: |
          bun ../scripts/port-content.ts
          node ../scripts/port-vocabulary.mjs
          node ../scripts/port-language-topics.mjs
          git diff --exit-code -- src/content/
      - run: bun ../scripts/validate-grammar-catalogue.ts
      - run: node ../scripts/validate-content.mjs
      - run: node ../scripts/validate-vocabulary.mjs
      - run: node ../scripts/validate-answer-audit.mjs
      - run: node ../scripts/validate-language-topics.mjs
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npx expo export --platform web
